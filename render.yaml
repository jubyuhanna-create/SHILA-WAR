services:
  - type: web
    name: shilla-war
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd server && npm install
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
